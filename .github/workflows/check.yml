name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript and run tests
        run: npm run check
      - name: Check Python syntax
        run: npm run python:check
      - name: Build package
        run: npm run pack:release
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: pi-legal-workbench
          path: dist/*.tgz
          if-no-files-found: error
